<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发工作台 · Eva 批注</title><link rel="stylesheet" href="./comments.css"><link rel="stylesheet" href="./developer.css"></head>
<body class="developer-workbench">
<header class="workbench-head"><div><p class="eyebrow">EVA / 共享批注</p><h1>开发工作台</h1></div><div class="head-links"><span id="build-info">正在读取版本…</span><a href="/" target="eva-prototype">返回原型</a></div></header>
<div class="workbench-layout">
<nav id="menus" aria-label="功能菜单"></nav>
<main>
<div class="table-heading"><div><h2 id="menu-title">全部功能</h2><span id="counts"></span></div><button id="refresh" type="button">检查更新</button></div>
<div class="filters"><div id="status" class="status-buttons" role="group" aria-label="状态筛选"><button type="button" data-status="all" aria-pressed="false">全部状态</button><button type="button" data-status="open" aria-pressed="false">待讨论</button><button type="button" data-status="approved" aria-pressed="false">已确认</button><button type="button" data-status="doing" aria-pressed="false">原型修改中</button><button type="button" data-status="done" aria-pressed="false">原型已改完</button></div><button id="reset-filters" type="button" title="恢复默认筛选，保留勾选">还原</button><label>认领<select id="claim-filter"><option value="all">全部</option><option value="unclaimed">未认领</option><option value="claimed">已认领</option></select></label><label class="search">搜索<input id="search" type="search" autocomplete="off" placeholder="编号、意见、姓名"><button id="clear-search" type="button" hidden>清除</button></label></div>
<div id="notice" role="status" aria-live="polite"></div>
<div class="table-scroll" tabindex="0" aria-label="批注列表，可横向滚动"><table><colgroup><col class="check-col"><col class="number-col"><col class="menu-col"><col class="body-col"><col class="kind-col"><col class="status-col"><col class="person-col"><col class="person-col"><col class="date-col"><col class="action-col"></colgroup><thead><tr><th><input type="checkbox" id="select-all" aria-label="全选当前筛选结果"></th><th>编号</th><th>功能菜单</th><th>批注意见 / 页面位置</th><th>类型</th><th>状态</th><th>提出者</th><th>认领者</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty">正在读取共享批注…</div></div>
<footer class="selection-bar"><div><strong id="selection-count">已选 0 条</strong><button id="clear-selection" type="button">清空</button></div><div class="batch-actions"><label>认领者<input id="assignee" maxlength="40" autocomplete="off" placeholder="填写你的名字"></label><button id="copy" type="button" disabled>复制提示词</button><button id="claim-copy" type="button" class="primary" disabled>认领并复制</button></div></footer>
</main>
</div>
<dialog id="detail" aria-labelledby="detail-title"><header><h2 id="detail-title">批注详情</h2><button type="button" data-close>关闭</button></header><div id="detail-content"></div><form id="reply-form" novalidate autocomplete="off"><label>回填说明 / 开发结果<textarea id="reply-body" maxlength="2000" placeholder="修改说明、提交或 PR、预览链接、实际验证结果"></textarea></label><p id="reply-error" role="alert"></p><button class="primary" type="submit">回填到原批注</button></form></dialog>
<dialog id="prompt-dialog" aria-labelledby="prompt-title"><header><h2 id="prompt-title">开发提示词</h2><button type="button" data-close>关闭</button></header><p id="copy-feedback"></p><textarea id="prompt-text" readonly aria-label="完整开发提示词"></textarea><button id="retry-copy" type="button" class="primary">复制全文</button></dialog>
<script src="../prototype/050-lucide-dom.js"></script>
<script type="module" src="./developer.js"></script>
</body></html>
